                text: copy.retry,
                on: { click: () => load({ force: true }) },
              }),
            ]),
          ]);
          return el("section", { cls: "panel panel--error", attr: { "aria-labelledby": "h-error" } }, [
            body,
          ]);
        }

        function banner(message) {
          const copy = C();
          return el("div", { cls: "banner", attr: { role: "group" } }, [
            el("span", { cls: "banner-text", text: copy.bannerText(message) }),
            el("button", {

        // ── main render ──────────────────────────────────────────────────────

        function renderMain(options) {
          const opts = options || {};
          const copy = C();
          const focusKey = opts.focusKey || null;
          const active = document.activeElement;
          const keepKey =
            focusKey || (active && active.getAttribute ? active.getAttribute("data-fk") : null);
          const hadBarFocus = Boolean(active && active.classList && active.classList.contains("day-bar"));
          const barIndex = state.barFocus;

          hideTip();
          clearNode(refs.main);
          refs.main.classList.toggle("enter", opts.animate === true);

          let index = 0;
          const add = (node) => {
            if (!node) return;
            node.style.setProperty("--i", String(index));
            index += 1;
            refs.main.appendChild(node);
          };

          if (state.error && !state.view) {
            add(errorState(state.error.message));
            return;
          }

          if (!state.view) {
            add(skeleton());
            return;
          }

          if (state.error && state.view) add(banner(state.error.message));

          if (state.view.totals.turns === 0) {
            add(emptyState());
          } else {
            add(renderKpis());
            add(
              panel(
                "trend",
                copy.secTrend,
                copy.trendMeta(
                  state.axis.length,
                  fmtCompact(
                    state.axis.reduce(
                      (best, slot) => Math.max(best, slot.input + slot.output + slot.cacheRead),
                      0,
                    ),
                  ),
                ),
                renderTrend(),
              ),
            );
            add(renderHeat());
            if (state.view.notes.length) add(renderNotes());
            if (state.view.projects.length) add(renderProjectsTable());
            if (state.view.models.length) add(renderModelsTable());
            add(renderSessions());
          }

          if (keepKey) {
            const target = refs.main.querySelector(`[data-fk="${cssEscape(keepKey)}"]`);
            if (target && typeof target.focus === "function") target.focus();
          } else if (hadBarFocus && state.view.totals.turns > 0) {
            const bars = refs.main.querySelectorAll(".day-bar");
            if (bars.length) {
              const index2 = Math.max(0, Math.min(bars.length - 1, barIndex));
              const target = bars[index2];
              if (target) {
                for (const bar of bars) bar.setAttribute("tabindex", bar === target ? "0" : "-1");
                target.focus();
              }
            }
          }

          syncScrollables();
          fitTrend();
        }

        function fitTrend() {
          const host = refs.main.querySelector(".panel--trend .trend-host");
          if (!host) return;
          const current = host.querySelector(".trend-svg");
          if (!current) return;
          const available = Math.round(host.clientWidth);
          if (available < 240) return;
          if (Math.abs(available - Number(current.getAttribute("width"))) < 2) return;
          host.replaceWith(renderTrend(available));
        }

        function cssEscape(value) {
          if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(String(value));
          return String(value).replace(/["\\]/g, "\\$&");
        }

        function syncScrollables() {
          const boxes = refs.main.querySelectorAll(".table-scroll, .heat-scroll");
          for (const box of boxes) {
            const overflowing = box.scrollWidth > box.clientWidth + 1;
            if (overflowing) box.setAttribute("tabindex", "0");
            else box.removeAttribute("tabindex");
            const hint = box.parentElement
              ? box.parentElement.querySelector(":scope > .scroll-hint")
              : null;
            if (hint) hint.hidden = !overflowing;
            else if (box.classList.contains("heat-scroll")) {
              const heatHint = refs.main.querySelector(".scroll-hint");
              if (heatHint) heatHint.hidden = !overflowing;
            }
          }
        }

        // ── actions ──────────────────────────────────────────────────────────

        function clearFilters() {
          if (state.projectId === null && state.modelId === null) return;
          state.projectId = null;
          state.modelId = null;
          renderFilters();
          load({});
        }

        function setDays(days) {
          const next = Math.max(1, Math.min(365, Math.round(Number(days) || 30)));
          if (next === state.days) {
            syncCheckedChip();
            return;
          }
          state.days = next;
          if (state.chipDays.indexOf(next) === -1) {
            state.chipDays = CHIP_DAYS.concat([next]).sort((a, b) => a - b);
          }
          renderFilters();
          load({});
        }

        function snapshotParams(force) {
          const payload = { days: state.days };
          if (state.projectId !== null) payload.projectId = state.projectId;
          if (state.modelId !== null) payload.modelId = state.modelId;
          if (force) payload.force = true;
          return payload;
        }

        // ── bridge ───────────────────────────────────────────────────────────

        function bridge() {
          const candidate = window.pluginBridge;
          return candidate && typeof candidate.invoke === "function" ? candidate : null;
        }

        async function call(channel, payload) {
          const api = bridge();
          if (!api) return { ok: false, code: "NO_BRIDGE", message: C().noBridge };
          try {
            const answer = await api.invoke(channel, payload);
            return answer && typeof answer === "object" ? answer : { ok: false, code: "BAD_ANSWER" };
          } catch (error) {
            const message =
              error && typeof error.message === "string" && error.message
                ? error.message
                : String(error);
            return { ok: false, code: "BRIDGE_ERROR", message };
          }
        }

        function setStatus(value) {
          if (!refs.status || refs.status.textContent === value) return;
          refs.status.textContent = value;
        }

        function updateButtons() {
          refs.refresh.dataset.busy = state.inflight ? "true" : "false";
          refs.refresh.setAttribute("aria-busy", state.inflight ? "true" : "false");
          refs.refresh.setAttribute("aria-label", state.inflight ? C().refreshBusy : C().refresh);
          refs.exportBtn.disabled = !state.view;
          refs.exportBtn.setAttribute("title", state.view ? C().exportHint : C().exportEmpty);
        }

        async function load(options) {
          const opts = options || {};
          const force = opts.force === true;
          // A background poll never stacks on top of a read in progress; any
          // user action supersedes it so a hung host answer cannot lock the view.
          if (state.inflight && !force && opts.silent === true) return;

          const seq = state.seq + 1;
          state.seq = seq;
          state.inflight = true;
          const hadData = Boolean(state.view);
          if (hadData) {
            refs.bar.dataset.refresh = "true";
            refs.main.setAttribute("aria-busy", "true");
          }
          setStatus(C().statusRefreshing);
          updateButtons();

          const answer = await call("stats.snapshot", snapshotParams(force));
          if (seq !== state.seq) return;

          state.inflight = false;
          refs.bar.dataset.refresh = "false";
          refs.main.removeAttribute("aria-busy");

          if (!answer || answer.ok !== true) {
            const message =
              (answer && typeof answer.message === "string" && answer.message) || C().unknownError;
            state.error = { message, code: (answer && answer.code) || "ERROR" };
            setStatus(C().statusFailed);
            renderMain({ animate: false });
            renderHeader();
            updateButtons();
            return;
          }

          state.error = null;
          state.view = normalize(answer);
          state.axis = buildDayAxis(state.view);
          // The payload echoes the filters it applied. A reported filter wins;
          // a null echo never clears a selection the user just made (an older
          // host, or a stub, may not echo at all).
          if (state.view.filters.projectId !== null) state.projectId = state.view.filters.projectId;
          if (state.view.filters.modelId !== null) state.modelId = state.view.filters.modelId;
          mergeCatalog(state.view);
          renderHeader();
          renderFilters();
          renderMain({ animate: state.firstPaint });
          state.firstPaint = false;
          updateButtons();
          setStatus(
            state.view.totals.turns === 0
              ? C().statusEmpty
              : C().statusReady(fmtTime(state.view.generatedAt)),
          );
          scheduleNext();
        }

        // ── polling ──────────────────────────────────────────────────────────

        function scheduleNext() {
          if (state.timer) window.clearTimeout(state.timer);
          state.timer = window.setTimeout(onTick, POLL_MS);
        }

        function onTick() {
          state.timer = null;
          if (document.visibilityState === "visible") load({ silent: true });
          scheduleNext();
        }

        // ── CSV ──────────────────────────────────────────────────────────────

        function csvCell(value) {
          const raw = value === null || value === undefined ? "" : String(value);
          if (/[",\n\r]/.test(raw)) return `"${raw.replace(/"/g, '""')}"`;
          return raw;
        }

        function csvTimestamp(ms) {
          const n = numOrNull(ms);
          if (n === null) return "";
          return nfDate({ year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(
            new Date(n),
          );
        }

        function buildCsv() {
          const copy = C();
          const view = state.view;
          const lines = [];
          const push = (cells) => lines.push(cells.map(csvCell).join(","));
          const days = view.window.days || state.days;
          push([
            `${copy.csvComment} BoneTokenStatistics · ${copy.subtitle(days, fmtDate(view.window.fromMs), fmtDate(view.window.toMs))}`,
          ]);
          push([`${copy.csvComment} ${copy.csvGenerated(csvTimestamp(view.generatedAt))}`]);
          lines.push("");
          push([`${copy.csvComment} ${copy.csvDaily}`]);
          push(copy.csvDailyCols);
          for (const day of view.days) {
            push([
              day.date,
              Math.round(day.tokens),
              Math.round(day.input),
              Math.round(day.output),
              Math.round(day.cacheRead),
              Math.round(day.cacheWrite),
              Math.round(day.reasoning),
              Math.round(day.turns),
            ]);
          }
          lines.push("");
          push([`${copy.csvComment} ${copy.csvProjects}`]);
          push(copy.csvProjectCols);
          for (const project of view.projects) {
            push([
              project.id === null ? "" : project.id,
              projectLabel(project),
              Math.round(project.tokens),
              fmtDec(project.share, 1),
              Math.round(project.turns),
              Math.round(project.sessions),
              Math.round(project.cacheRead),
              csvTimestamp(project.lastAt),
            ]);
          }
          lines.push("");
          push([`${copy.csvComment} ${copy.csvModels}`]);
          const modelCols = copy.csvModelCols.slice();
          if (view.cost) modelCols.push(`${copy.csvAmount} (${view.cost.currency || view.settings.currency || ""})`);
          push(modelCols);
          const amounts = new Map();
          if (view.cost) for (const row of view.cost.byModel) amounts.set(row.modelId, row.amount);
          for (const model of view.models) {
            const cells = [
              model.id,
              model.providerId || "",
              Math.round(model.tokens),
              fmtDec(model.share, 1),
              Math.round(model.turns),
              Math.round(model.avgPerTurn),
              fmtDec(model.tokensPerSecond, 2),
              Math.round(model.cacheRead),
            ];
            if (view.cost) {
              const amount = amounts.get(model.id);
              cells.push(amount === undefined ? "" : amount);
            }
            push(cells);
          }
          return lines.join("\r\n");
        }

        function exportCsv() {
          if (!state.view) return;
          const copy = C();
          const view = state.view;
          const days = view.window.days || state.days;
          const endKey = keyOf(
            view.window.toMs !== null ? new Date(view.window.toMs) : new Date(),
          );
          let payload;
          try {
            payload = buildCsv();
          } catch {
            setStatus(copy.exportFailed);
            return;
          }
          try {
            const blob = new Blob([`\uFEFF${payload}`], { type: "text/csv;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = `bone-token-stats-${days}d-${endKey}.csv`;
            anchor.rel = "noopener";
            anchor.style.display = "none";
            document.body.appendChild(anchor);
            anchor.click();
            window.setTimeout(() => {
              anchor.remove();
              URL.revokeObjectURL(url);
            }, 2000);
            setStatus(copy.exportDone);
          } catch {
            setStatus(copy.exportFailed);
          }
        }

        // ── appearance ───────────────────────────────────────────────────────

        const schemeQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;

        function localeFor(tag) {
          return /^zh/i.test(text(tag)) ? "zh-CN" : "en";
        }

        function applyAppearance(appearance) {
          const base = appearance && typeof appearance.base === "string" ? appearance.base : "";
          const resolved =
            base === "light" || base === "dark"
              ? base
              : base === "system"
                ? schemeQuery && schemeQuery.matches
                  ? "light"
                  : "dark"
                : "dark";
          if (resolved !== state.base) {
            state.base = resolved;
            document.documentElement.dataset.base = resolved;
          }
          const rawLocale = appearance && typeof appearance.locale === "string" ? appearance.locale : "";
          const nextLocale = rawLocale ? localeFor(rawLocale) : state.locale;
          if (nextLocale !== state.locale) {
            state.locale = nextLocale;
            buildFormatters();
            applyCopy();
            renderFilters();
            renderHeader();
            renderMain({ animate: false });
            updateButtons();
          }
        }

        // ── wiring ───────────────────────────────────────────────────────────

        function bindEvents() {
          refs.refresh.addEventListener("click", () => load({ force: true }));
          refs.exportBtn.addEventListener("click", exportCsv);
          refs.clear.addEventListener("click", clearFilters);

          refs.project.addEventListener("change", () => {
            const raw = refs.project.value;
            state.projectId = raw === "" ? null : Number(raw);
            renderFilters();
            load({});
          });
          refs.model.addEventListener("change", () => {
            const raw = refs.model.value;
            state.modelId = raw === "" ? null : raw;
            renderFilters();
            load({});
          });

          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") load({});
          });

          window.addEventListener("pagehide", () => {
            if (state.timer) window.clearTimeout(state.timer);
            state.timer = null;
          });

          let resizeFrame = 0;
          const onResize = () => {
            if (resizeFrame) window.cancelAnimationFrame(resizeFrame);
            resizeFrame = window.requestAnimationFrame(() => {
              resizeFrame = 0;
              if (!state.view || state.view.totals.turns === 0) return;
              fitTrend();
              syncScrollables();
            });
          };
          window.addEventListener("resize", onResize);
          if (typeof ResizeObserver === "function") {
            const observer = new ResizeObserver(onResize);
            observer.observe(refs.main);
          }

          if (schemeQuery) {
            const onScheme = () => {
              if (!state.appearance || (state.appearance.base !== "light" && state.appearance.base !== "dark")) {
                applyAppearance(state.appearance);
              }
            };
            if (typeof schemeQuery.addEventListener === "function") schemeQuery.addEventListener("change", onScheme);
          }
        }

        function withTimeout(promise, ms) {
          return new Promise((resolve) => {
            let settled = false;
            const timer = window.setTimeout(() => {
              if (settled) return;
              settled = true;
              resolve(null);
            }, ms);
            promise.then(
              (value) => {
                if (settled) return;
                settled = true;
                window.clearTimeout(timer);
                resolve(value);
              },
              () => {
                if (settled) return;
                settled = true;
                window.clearTimeout(timer);
                resolve(null);
              },
            );
          });
        }

        function boot() {
          state.locale = localeFor(navigator.language || "");
          buildFormatters();
          applyCopy();
          renderFilters();
          renderHeader();
          renderMain({ animate: false });
          updateButtons();
          bindEvents();

          const api = bridge();
          if (api && typeof api.on === "function") {
            try {
              api.on("appearance:changed", (appearance) => {
                state.appearance = appearance;
                applyAppearance(appearance);
              });
            } catch {
              /* older hosts may not expose events */
            }
          }

          applyAppearance(null);
          withTimeout(
            call("app.getAppearance").then((appearance) => {
              if (appearance && appearance.ok === false) return null;
              state.appearance = appearance;
              applyAppearance(appearance);
              return appearance;
            }),
            PING_TIMEOUT_MS,
          ).then(() => {
            withTimeout(call("stats.ping"), PING_TIMEOUT_MS).then((ping) => {
              if (ping && ping.ok === true) {
                const defaultDays = Number(ping.defaultDays);
                if (CHIP_DAYS.indexOf(defaultDays) !== -1 || (defaultDays >= 1 && defaultDays <= 365)) {
                  if (!state.chipDays.includes(defaultDays)) {
                    state.chipDays = CHIP_DAYS.concat([defaultDays]).sort((a, b) => a - b);
                  }
                  state.days = Math.max(1, Math.min(365, Math.round(defaultDays)));
                  renderFilters();
                }
              }
              load({});
            });
          });
          scheduleNext();
        }

        boot();
      })();
    </script>
  </body>
</html>
